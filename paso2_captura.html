<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso 2: Evidencia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f0f0f; color: white; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .box { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; margin-bottom: 15px; }
        
        .btn { display: block; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; cursor: pointer; transition: 0.3s; }
        .btn-site { background: #E50914; color: white; }
        
        .upload-btn { border: 2px dashed #555; background: transparent; color: #888; width: 100%; box-sizing: border-box; }
        .upload-btn:hover { border-color: #E50914; color: white; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Validación Visual</h2>
    
    <div class="box">
        <p>1. Visita el sitio y ve al final de cualquier historia.</p>
        <a href="https://tusinitusineli.com" target="_blank" class="btn btn-site">Ir al Sitio Web</a>
    </div>

    <div class="box">
        <p>2. Sube la captura de pantalla aquí:</p>
        <label class="btn upload-btn">
            📷 Seleccionar Captura
            <input type="file" onchange="upload()">
        </label>
        <p id="msg" style="font-size: 12px; color: #E50914; display: none; margin-top: 10px;">Analizando imagen...</p>
    </div>
</div>

<script>
    function upload() {
        const msg = document.getElementById('msg');
        msg.style.display = "block";
        msg.innerText = "Analizando metadatos...";
        msg.style.color = "yellow";
        
        setTimeout(() => {
            msg.innerText = "✅ Captura Correcta";
            msg.style.color = "#0f0";
            setTimeout(() => window.location.href = 'paso3_proceso.html', 1000);
        }, 3000);
    }
</script>
</body>
</html>
